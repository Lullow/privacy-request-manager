<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="pictures/fav.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
<h1>Fyll i dina uppgifter här</h1>

<img src="pictures/picture3.png" alt="Logo" class="form-image">

<div class="form" >
<!--Replace action later to collect data-->
    <form action="#" method="post"> 

        <label for="name">För- och efternamn</label>
        <input type="text" id="name" name="name" required>
        
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        
        <br>

        <label for="city">Ort</label>
        <input type="text" id="city" name="city" required>
        
        <br>

        <label for="site">Välj webbplats</label>
        <select name="site" id="site" required>
            <option value="" selected disabled>Välj alternativ</option>
            <option>Ratsit</option>
            <option>MrKoll</option>
            <option>Birthday</option>
            <option>Hitta</option>
            <option>Eniro</option>
            <option>Upplysning</option>
            <option>Merinfo</option>
            <option>Biluppgifter</option>
            <option>Google (delisting)</option>
        </select>

    </form>
</div>

</body>
</html>
