<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

    <!-- Header -->
    <!-- Notification icon. Scalable vector graphics (svg) from heroicons -->
    <div class="dashboard-header">
        <h1>Mina ärenden</h1>

    <!-- Class header-icons to move h1 independently -->
        <div class="header-icons">
            <button class="notification-btn">
                    <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                    </svg>
            </button>

        <!-- Message icon. Scalable vector graphics (svg) from heroicons -->
            <button class="message-btn">
                <svg class="message-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
            </button>

        <!-- Dashboard icon. Scalable vector graphics (svg) from heroicons (change name from dashboard button) -->
            <button class="dashboard-button">
                    <svg class="dashboard-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                    </svg>
            </button>
        </div>
    </div>


    <!-- Filters + Donut -->
    <div class="dashboard-top">
        <div class="filters">
            <label><input type="checkbox" checked> Alla</label> 
            <label><input type="checkbox" checked> Pågående</label>
            <label><input type="checkbox" checked> Avslutad</label>
        </div>

        <div class="donut" data-waiting="50" data-complete="30" data-denied="20">
            <div class="donut-center">
                0 <!-- Startingvalue -->
                <span>Ärenden</span>
            </div>
        </div>
    </div>
    <div class="border">
    <!-- Case-list -->
    <div class="case-list">
        <!-- header row -->
        <div class="case-row header">
            <div class="cell">Företag</div>
            <div class="cell">Status</div>
            <div class="cell">Åtgärder</div>
        </div>

        <!-- Case rows -->
        <div class="case-row">
            <div class="cell"><a href="https://www.merinfo.se">Merinfo</a></div>
            <div class="cell status waiting">Pågående</div>
            <div class="cell case-actions">
                <button class="btn-dashboard">Visa</button>
                <button class="btn-dashboard">Skicka påminnelse</button>
            </div>
        </div>

        <div class="case-row">
            <div class="cell"><a href="https://www.ratsit.se">Ratsit</a></div>
            <div class="cell status complete">Avslutad</div>
            <div class="cell case-actions">
                <button class="btn-dashboard">Visa</button>
                <button class="btn-dashboard">Skicka påminnelse</button>
            </div>
        </div>

        <div class="case-row">
            <div class="cell"><a href="https://mrkoll.se">MrKoll</a></div>
            <div class="cell status complete">+ 30 dagar</div>
            <div class="cell case-actions">
                <button class="btn-dashboard">Visa</button>
                <button class="btn-dashboard">Skicka påminnelse</button>
            </div>
        </div>
    </div>
    </div>

<!-- Question section -->
<section class="dashboard-under-panel">
    <div class="questions">
        <h3>Har du frågor?</h3>
        <h5>Vad är mina rättigheter?</h5>
        <h5>Vad är paragraf 17?</h5>
        <h5>Varför blev mitt ärende nekat och vad är nästa steg?</h5>
        <h5>Inom hur lång tid ska ett företag svara?</h5>
    </div>
</section>

<!-- Animation JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const donut = document.querySelector(".donut");
    const center = donut.querySelector(".donut-center");

    const complete = parseInt(donut.dataset.complete);
    const waiting = parseInt(donut.dataset.waiting);
    const denied = parseInt(donut.dataset.denied);

    let currentComplete = 0;
    let currentWaiting = 0;
    let currentDenied = 0;

    const animationSteps = 100;
    let step = 0;

    const animateDonut = () => {
        step++;
        currentComplete = (complete / animationSteps) * step;
        currentWaiting = (waiting / animationSteps) * step;
        currentDenied = (denied / animationSteps) * step;

        donut.style.setProperty('--complete', `${currentComplete}%`);
        donut.style.setProperty('--waiting', `${currentComplete + currentWaiting}%`);
        donut.style.setProperty('--denied', `${currentComplete + currentWaiting + currentDenied}%`);

        if (step < animationSteps) {
            requestAnimationFrame(animateDonut);
        }
    };

    animateDonut();

    let total = 0;
    const totalCount = document.querySelectorAll(".status").length;

    const animateCenter = () => {
        total++;
        center.firstChild.textContent = total;
        if(total < totalCount) {
            setTimeout(animateCenter, 1000 / totalCount);
        }
    };
    animateCenter();
});
</script>

</section>
</body>
</html>
